<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>リンさんカウンター</title>
  <link rel="stylesheet" href="./css/style.css?v=20260803-3" />
</head>
<body>
  <header class="header">
    <h1 class="title">リンさんカウンター</h1>
    <div id="meta" class="meta" data-dht="status" aria-live="polite"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="表示切り替え">
    <button id="tab-total" type="button" class="tab active" role="tab" aria-selected="true" aria-controls="tTotal" data-tab="tTotal">Total Since 2025</button>
    <button id="tab-total-2026" type="button" class="tab" role="tab" aria-selected="false" aria-controls="tTotal2026" data-tab="tTotal2026">Total 2026</button>
    <button id="tab-ranking-2026" type="button" class="tab" role="tab" aria-selected="false" aria-controls="tRanking2026" data-tab="tRanking2026">Ranking 2026</button>
    <button id="tab-fig-2025" type="button" class="tab" role="tab" aria-selected="false" aria-controls="tFig2025" data-tab="tFig2025">Fig 2025</button>
  </nav>

  <main class="content">
    <section id="tTotal" class="panel active" role="tabpanel" aria-labelledby="tab-total">
      <div class="card card--center">
        <div class="big-number" data-dht="total-since-2025">–</div>
        <div class="caption">⭐ᗪᕼ丅⭐と言われた回数</div>
      </div>
    </section>

    <section id="tTotal2026" class="panel" role="tabpanel" aria-labelledby="tab-total-2026" hidden>
      <div class="card card--center">
        <div class="big-number" data-dht="total-current-year">–</div>
        <div class="caption"><span data-dht="year">2026</span>年に⭐ᗪᕼ丅⭐と言われた回数</div>
      </div>
    </section>

    <section id="tRanking2026" class="panel" role="tabpanel" aria-labelledby="tab-ranking-2026" hidden>
      <div class="card ranking-card">
        <h2>DHT Championship <span data-dht="year">2026</span></h2>
        <div id="rankingPodium" class="dht-ranking-podium" aria-label="上位3名"></div>
        <div id="rankingList" class="dht-ranking-list" aria-label="4位以下"></div>
      </div>
    </section>

    <section id="tFig2025" class="panel" role="tabpanel" aria-labelledby="tab-fig-2025" hidden>
      <div class="card card--center">
        <div class="fig-2025">
          <div class="fig-side">
            <span class="fig-number" data-dht="fig-2025-c">–</span>
            <span class="fig-label">Cさん</span>
          </div>
          <div class="fig-dash" aria-hidden="true">−</div>
          <div class="fig-side">
            <span class="fig-number" data-dht="fig-2025-others">–</span>
            <span class="fig-label">その他</span>
          </div>
        </div>
        <div class="fig-total">合計 <span data-dht="fig-2025-total">–</span>回</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const panels = [...document.querySelectorAll('[role="tabpanel"]')];

      const activate = (targetId) => {
        tabs.forEach((tab) => {
          const selected = tab.dataset.tab === targetId;
          tab.classList.toggle('active', selected);
          tab.setAttribute('aria-selected', String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });

        panels.forEach((panel) => {
          const selected = panel.id === targetId;
          panel.classList.toggle('active', selected);
          panel.hidden = !selected;
        });
      };

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => activate(tab.dataset.tab));
      });

      activate('tTotal');
    })();
  </script>

  <script src="./js/config.js?v=20260803-3"></script>
  <script src="./js/api.js?v=20260803-3"></script>
  <script src="./js/main.js?v=20260803-3"></script>
</body>
</html>
