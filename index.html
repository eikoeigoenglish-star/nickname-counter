<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>リンさんカウンター</title>

  <link rel="stylesheet" href="./css/style.css?v=1">

  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script defer src="./js/config.js?v=1"></script>
  <script defer src="./js/api.js?v=1"></script>
  <script defer src="./js/main.js?v=1"></script>
</head>
<body>
  <header class="header">
    <h1 class="title">リンさんカウンター</h1>
    <p id="status" class="status" role="status" aria-live="polite">読み込み中…</p>
  </header>

  <nav class="tabs" aria-label="表示切り替え" role="tablist">
    <button class="tab is-active" type="button" role="tab"
      aria-selected="true" aria-controls="panel-total" data-tab="total">
      Total Since 2025
    </button>
    <button id="yearTotalTab" class="tab" type="button" role="tab"
      aria-selected="false" aria-controls="panel-year-total" data-tab="year-total">
      Total
    </button>
    <button id="graphTab" class="tab" type="button" role="tab"
      aria-selected="false" aria-controls="panel-graph" data-tab="graph">
      Graph
    </button>
    <button id="historyTab" class="tab" type="button" role="tab"
      aria-selected="false" aria-controls="panel-history" data-tab="history">
      History
    </button>
    <button class="tab" type="button" role="tab"
      aria-selected="false" aria-controls="panel-fig-2025" data-tab="fig-2025">
      Fig 2025
    </button>
  </nav>

  <main class="content">
    <section id="panel-total" class="panel" role="tabpanel" data-panel="total">
      <div class="card total-card">
        <div id="totalValue" class="big-number">–</div>
        <div class="counter-caption">
          <div class="arrow">↑</div>
          <div>⭐ᗪᕼ丅⭐と</div>
          <div>言われた回数</div>
        </div>
      </div>
    </section>

    <section id="panel-year-total" class="panel" role="tabpanel"
      data-panel="year-total" hidden>
      <div class="card total-card">
        <div id="yearTotalValue" class="big-number">–</div>
        <div class="counter-caption">
          <div class="arrow">↑</div>
          <div>⭐ᗪᕼ丅⭐と</div>
          <div>言われた回数</div>
        </div>
      </div>
    </section>

    <section id="panel-graph" class="panel" role="tabpanel"
      data-panel="graph" hidden>
      <div class="card">
        <div class="chart-wrap">
          <canvas id="cumulativeChart" aria-label="発言者別の累積回数グラフ"></canvas>
        </div>
        <div id="graphDescription" class="description"></div>
      </div>
    </section>

    <section id="panel-history" class="panel" role="tabpanel"
      data-panel="history" hidden>
      <div class="card">
        <div class="pager">
          <button id="historyPrev" class="pager-button" type="button" aria-label="前のページ">◀</button>
          <div id="historyPageInfo" class="pager-info">–</div>
          <button id="historyNext" class="pager-button" type="button" aria-label="次のページ">▶</button>
        </div>

        <div class="table-wrap">
          <table class="history-table">
            <thead>
              <tr>
                <th class="date-column">日付</th>
                <th class="name-column">発言者</th>
                <th>リンク</th>
              </tr>
            </thead>
            <tbody id="historyBody">
              <tr><td colspan="3" class="empty-cell">タブを開くと読み込みます</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="panel-fig-2025" class="panel" role="tabpanel"
      data-panel="fig-2025" hidden>
      <div class="card figure-card">
        <div class="figure-number">
          <span id="fig2025CValue">–</span>
          <span class="dash">−</span>
          <span id="fig2025OthersValue">–</span>
        </div>
        <div class="figure-labels">
          <div class="figure-label figure-label-left">
            <div>Cさんに　　↑</div>
            <div>⭐ᗪᕼ丅⭐と</div>
            <div>言われた回数</div>
          </div>
          <div class="figure-label figure-label-right">
            <div>↑　　他の人に</div>
            <div>⭐ᗪᕼ丅⭐と</div>
            <div>言われた回数</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <noscript>
    <p class="noscript">このページにはJavaScriptが必要です。</p>
  </noscript>
</body>
</html>
